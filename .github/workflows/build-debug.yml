name: Build Debug APK

on:
  push:
    branches: [ main, master, luau-env ]
  pull_request:
    branches: [ main, master, luau-env ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build & Sign Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Fix gradle.properties for Linux CI runner
        run: |
          set -euo pipefail
          if [ -f gradle.properties ]; then
            sed -i '/android\.aapt2FromMavenOverride/d' gradle.properties
            echo "Cleaned gradle.properties (removed Termux/Android AAPT2 override):"
            cat gradle.properties
          fi

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Sign APK with public keystore (or GitHub Secrets override)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK_IN="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_IN" ]; then
            echo "Error: Expected debug APK not found at $APK_IN"
            exit 1
          fi

          KS_PATH=""
          KS_ALIAS="studrblx"
          KS_PASS="studrblx123"
          KEY_PASS="studrblx123"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using keystore from GitHub Secrets..."
            KS_PATH="${RUNNER_TEMP}/custom-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS_PATH"
            KS_ALIAS="${KEY_ALIAS:-$KS_ALIAS}"
            KS_PASS="${KEYSTORE_PASSWORD:-$KS_PASS}"
            KEY_PASS="${KEY_PASSWORD:-$KS_PASS}"
          elif [ -f "signing/studrblx-public.jks" ]; then
            echo "Using public keystore at signing/studrblx-public.jks..."
            KS_PATH="signing/studrblx-public.jks"
          elif [ -f "studrblx-public.jks" ]; then
            echo "Using public keystore at studrblx-public.jks..."
            KS_PATH="studrblx-public.jks"
          else
            echo "::warning::studrblx-public.jks not found in signing/ or repo root. Keeping default Gradle debug signature."
            exit 0
          fi

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_VER="$(ls -1 "$SDK_DIR/build-tools" | sort -V | tail -n 1)"
          BUILD_TOOLS_DIR="$SDK_DIR/build-tools/$BUILD_TOOLS_VER"
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          APK_ALIGNED="${RUNNER_TEMP}/app-debug-aligned.apk"
          APK_SIGNED="app/build/outputs/apk/debug/StudioRblx-debug-signed.apk"

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$APK_IN" "$APK_ALIGNED"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KS_PATH" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK_SIGNED" \
            "$APK_ALIGNED"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_SIGNED"
          rm -f "$APK_IN"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudioRblx-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
